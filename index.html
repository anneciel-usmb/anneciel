<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Anneciel</title>
<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #e9f7ff, #ffffff);
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 35px 20px;
    }

    .container {
        width: 100%;
        max-width: 450px;
        text-align: center;
    }

    /* Logo */
    .logo {
        width: 95px;
        height: 95px;
        margin: 0 auto 15px;
        border-radius: 50%;
        background: white;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 32px;
        font-weight: bold;
        box-shadow: 0 5px 20px rgba(0,0,0,0.10);
    }

    h1 {
        margin: 0;
        font-size: 30px;
        color: #111;
    }

    .description {
        margin: 10px 0 30px;
        color: #666;
        font-size: 15px;
        line-height: 1.5;
    }

    /* Boutons */
    .links {
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    .link {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 58px;
        padding: 15px 20px;
        border-radius: 16px;
        background: white;
        color: #111;
        text-decoration: none;
        font-size: 16px;
        font-weight: bold;
        box-shadow: 0 5px 18px rgba(0,0,0,0.08);
        transition: transform 0.15s, box-shadow 0.15s;
    }

    .link:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 22px rgba(0,0,0,0.12);
    }

    .link:active {
        transform: scale(0.97);
    }

    /* Icône */
    .icon {
        margin-right: 10px;
        font-size: 21px;
    }

    /* Pied de page */
    .footer {
        margin-top: 30px;
        color: #999;
        font-size: 12px;
    }
</style>
</head>
<body>
<div class="container">

    <!-- Logo -->
    <div class="logo">
        <img src="Anneciel Logo 2.png" alt="Logo Anneciel">
    </div>

    <!-- Nom -->
    <h1>Anneciel</h1>

    <p class="description">
        Association étudiante de Polytech Annecy-Chambéry
    </p>

    <!-- BOUTONS -->
    <div class="links">

        <!-- Inscription adhérents -->
        <a
            class="link"
            href="https://docs.google.com/forms/d/1XjCSVkBkY0Sz0ya7bENIT0Yz8oHk_K9AjLOkpabSZYs/viewform"
            target="_blank"
            rel="noopener noreferrer">

            <span class="icon">📝</span>
            Inscription adhérents

        </a>


        <!-- Instagram -->
        <a
            class="link"
            href="https://www.instagram.com/anneciel_polytech/"
            target="_blank"
            rel="noopener noreferrer">

            <span class="icon">📸</span>
            Instagram Anneciel

        </a>

    </div>

    <div class="footer">
        © Anneciel
    </div>

</div>
</body>
</html>
