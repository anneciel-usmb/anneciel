<!DOCTYPE html>

<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Anneciel</title>

<link rel="icon" type="image/png" sizes="512x512" href="Anneciel Favicon.png">
<link rel="apple-touch-icon" href="Anneciel Favicon.png">

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #e9f7ff, #ffffff);
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 30px 20px;
    }

    .container {
        width: 100%;
        max-width: 450px;
        text-align: center;
    }

    .logo {
        width: 120px;
        height: 120px;
        margin: 0 auto 18px;
    }

    .logo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
    }

    h1 {
        margin: 0;
        font-size: 30px;
        color: #111;
    }

    .description {
        margin: 10px 0 25px;
        color: #666;
        font-size: 15px;
        line-height: 1.5;
    }

    .links {
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    .link {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 58px;
        padding: 15px 20px;
        border-radius: 16px;
        background: white;
        color: #111;
        text-decoration: none;
        font-size: 16px;
        font-weight: bold;
        box-shadow: 0 5px 18px rgba(0,0,0,0.08);
        cursor: pointer;
        transition: transform 0.15s;
    }

    .link:active {
        transform: scale(0.97);
    }

    .icon {
        margin-right: 10px;
        font-size: 21px;
    }

    /* Fenêtre de sortie */
    #externalBrowser {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.55);
        padding: 20px;
        justify-content: center;
        align-items: center;
        z-index: 9999;
    }

    .browserBox {
        width: 100%;
        max-width: 380px;
        background: white;
        border-radius: 22px;
        padding: 28px 22px;
        text-align: center;
    }

    .browserBox .bigIcon {
        font-size: 45px;
        margin-bottom: 10px;
    }

    .browserBox h2 {
        margin: 5px 0 12px;
        font-size: 21px;
    }

    .browserBox p {
        color: #666;
        font-size: 14px;
        line-height: 1.5;
    }

    .openButton {
        display: block;
        margin-top: 18px;
        padding: 15px;
        border-radius: 13px;
        background: #111;
        color: white;
        text-decoration: none;
        font-weight: bold;
    }

    .closeButton {
        display: block;
        margin-top: 12px;
        padding: 12px;
        color: #777;
        background: none;
        border: none;
        width: 100%;
        font-size: 14px;
    }

    .footer {
        margin-top: 30px;
        color: #999;
        font-size: 12px;
    }
</style>

</head>

<body>

<div class="container">

<div class="logo">
    <img src="Anneciel Logo Web.png" alt="Logo Anneciel">
</div>

<h1>Anneciel</h1>

<p class="description">
    Association étudiante de Polytech Annecy-Chambéry
</p>

<div class="links">

    <!-- INSCRIPTION -->
    <a
        class="link"
        href="https://docs.google.com/forms/d/1XjCSVkBkY0Sz0ya7bENIT0Yz8oHk_K9AjLOkpabSZYs/viewform"
        onclick="openExternal(event, this.href)">

        <span class="icon">📝</span>
        Inscription adhérents

    </a>


    <!-- PRÉSENTATION -->
    <a
        class="link"
        href="https://canva.link/nymqvmemnlndk6r"
        onclick="openExternal(event, this.href)">

        <span class="icon">📊</span>
        Présentation Anneciel

    </a>


    <!-- INSTAGRAM -->
    <a
        class="link"
        href="https://www.instagram.com/anneciel_polytech/"
        onclick="openExternal(event, this.href)">

        <span class="icon">📸</span>
        Instagram Anneciel

    </a>

</div>

<div class="footer">
    © Anneciel
</div>

</div>

<!-- FENÊTRE NAVIGATEUR EXTERNE -->

<div id="externalBrowser">

<div class="browserBox">

    <div class="bigIcon">🌐</div>

    <h2>Ouvrir dans le navigateur</h2>

    <p>
        Pour accéder correctement à ce lien,
        ouvre-le dans Chrome ou Safari.
    </p>

    <a
        id="externalButton"
        class="openButton"
        href="#"
        target="_blank"
        rel="noopener noreferrer">

        Ouvrir dans le navigateur

    </a>

    <button
        class="closeButton"
        onclick="closeBrowserBox()">

        Retour

    </button>

</div>

</div>

<script>

function isInstagram() {

    const ua = navigator.userAgent || navigator.vendor || window.opera;

    return (
        ua.includes("Instagram") ||
        ua.includes("FBAN") ||
        ua.includes("FBAV")
    );
}


function isAndroid() {

    return /Android/i.test(navigator.userAgent);

}


function isIOS() {

    return /iPhone|iPad|iPod/i.test(navigator.userAgent);

}


function openExternal(event, url) {

    if (!isInstagram()) {
        return;
    }

    event.preventDefault();

    /*
     * ANDROID
     *
     * On tente d'utiliser le système Android
     * pour ouvrir Chrome à l'extérieur d'Instagram.
     */

    if (isAndroid()) {

        try {

            const parsed = new URL(url);

            const intentUrl =
                "intent://" +
                parsed.host +
                parsed.pathname +
                parsed.search +
                "#Intent;" +
                "scheme=https;" +
                "package=com.android.chrome;" +
                "end";

            window.location.href = intentUrl;

            return;

        } catch (e) {

            console.log("Intent Android impossible");

        }

    }


    /*
     * IPHONE / IPAD
     *
     * iOS ne permet pas de forcer Safari depuis
     * le navigateur intégré Instagram.
     */

    document.getElementById("externalButton").href = url;

    document.getElementById("externalBrowser").style.display = "flex";

}


function closeBrowserBox() {

    document.getElementById("externalBrowser").style.display = "none";

}

</script>

</body>
</html>
