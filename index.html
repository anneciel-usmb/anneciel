<!DOCTYPE html>

<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Anneciel</title>

<!-- Favicon -->
<link rel="icon" type="image/png" sizes="512x512" href="Anneciel Favicon.png">
<link rel="apple-touch-icon" sizes="512x512" href="Anneciel Favicon.png">

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #e9f7ff, #ffffff);
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 35px 20px;
    }

    .container {
        width: 100%;
        max-width: 450px;
        text-align: center;
    }

    /* LOGO */
    .logo {
        width: 120px;
        height: 120px;
        margin: 0 auto 18px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .logo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
    }

    /* TITRE */
    h1 {
        margin: 0;
        font-size: 30px;
        color: #111;
    }

    .description {
        margin: 10px 0 30px;
        color: #666;
        font-size: 15px;
        line-height: 1.5;
    }

    /* BOUTONS */
    .links {
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    .link {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 58px;
        padding: 15px 20px;
        border-radius: 16px;
        background: white;
        color: #111;
        text-decoration: none;
        font-size: 16px;
        font-weight: bold;
        box-shadow: 0 5px 18px rgba(0,0,0,0.08);
        transition: transform 0.15s, box-shadow 0.15s;
    }

    .link:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 22px rgba(0,0,0,0.12);
    }

    .link:active {
        transform: scale(0.97);
    }

    .icon {
        margin-right: 10px;
        font-size: 21px;
    }

    /* PIED DE PAGE */
    .footer {
        margin-top: 30px;
        color: #999;
        font-size: 12px;
    }
</style>
</head>
<body>
<div class="container">

    <!-- LOGO -->
    <div class="logo">
        <img src="Anneciel Logo Web.png" alt="Logo Anneciel">
    </div>

    <!-- NOM -->
    <h1>ANNECIEL</h1>

    <p class="description">
        Association étudiante de Polytech Annecy-Chambéry
    </p>

    <!-- BOUTONS -->
    <div class="links">

        <!-- INSCRIPTION ADHÉRENTS -->
        <a
            class="link"
            href="https://docs.google.com/forms/d/1XjCSVkBkY0Sz0ya7bENIT0Yz8oHk_K9AjLOkpabSZYs/viewform"
            target="_blank"
            rel="noopener noreferrer">

            <span class="icon">📝</span>
            Inscription adhérents

        </a>

        <!-- PRÉSENTATION ANNECIEL -->

        <a
            class="link"
            href="https://canva.link/nymqvmemnlndk6r"
            target="_blank"
            rel="noopener noreferrer">

            <span class="icon">📊</span>
            Présentation Anneciel

        </a>


        <!-- INSTAGRAM -->
        <a
            class="link"
            href="https://www.instagram.com/anneciel_polytech/"
            target="_blank"
            rel="noopener noreferrer">

            <span class="icon">📸</span>
            Instagram Anneciel

        </a>

        <!--
        POUR AJOUTER UN NOUVEAU BOUTON :

        <a
            class="link"
            href="TON-LIEN"
            target="_blank"
            rel="noopener noreferrer">

            <span class="icon">🔗</span>
            Nom du bouton

        </a>
        -->

    </div>
    <div class="footer">
        © Anneciel
    </div>
</div>
</body>
</html>
