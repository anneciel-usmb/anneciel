<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #e8f6ff, #ffffff);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .card {
        width: 100%;
        max-width: 420px;
        background: white;
        border-radius: 24px;
        padding: 35px 25px;
        text-align: center;
        box-shadow: 0 10px 35px rgba(0,0,0,0.10);
    }

    .logo {
        width: 90px;
        height: 90px;
        margin: 0 auto 20px;
        border-radius: 50%;
        background: #f0f0f0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        font-weight: bold;
    }

    h1 {
        margin: 0 0 12px;
        font-size: 28px;
        color: #111;
    }

    p {
        margin: 0 0 28px;
        color: #666;
        font-size: 16px;
        line-height: 1.5;
    }

    .button {
        display: block;
        width: 100%;
        padding: 17px 20px;
        border-radius: 14px;
        background: #111;
        color: white;
        text-decoration: none;
        font-size: 17px;
        font-weight: bold;
        transition: transform 0.15s;
    }

    .button:active {
        transform: scale(0.97);
    }

    .note {
        margin-top: 18px;
        font-size: 13px;
        color: #999;
        line-height: 1.4;
    }
</style>
```

</head>

<body>

<div class="card">

    </p>

    <a
        class="button"
        href="https://docs.google.com/forms/d/1XjCSVkBkY0Sz0ya7bENIT0Yz8oHk_K9AjLOkpabSZYs/viewform"

        Ouvrir le formulaire
    </a>

    <div class="note">
        Si le formulaire reste dans Instagram, utilise le menu ⋯
        puis choisis « Ouvrir dans le navigateur ».
    </div>

</div>
