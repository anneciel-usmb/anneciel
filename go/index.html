<title>Anneciel</title>

<script>
    const destination = "https://anneciel-usmb.github.io/anneciel/";

    const ua = navigator.userAgent || navigator.vendor || window.opera;

    const isInstagram =
        ua.includes("Instagram") ||
        ua.includes("FBAN") ||
        ua.includes("FBAV");

    const isAndroid = /Android/i.test(ua);

    const isIOS =
        /iPhone|iPad|iPod/i.test(ua) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);


    function redirect() {

        /*
         * ANDROID
         *
         * On demande à Android d'ouvrir Chrome.
         */

        if (isAndroid) {

            const intent =
                "intent://anneciel-usmb.github.io/anneciel/" +
                "#Intent;" +
                "scheme=https;" +
                "package=com.android.chrome;" +
                "S.browser_fallback_url=" +
                encodeURIComponent(destination) +
                ";end";

            window.location.href = intent;

            setTimeout(function() {
                window.location.href = destination;
            }, 1500);

            return;
        }


        /*
         * iPHONE / iPAD
         *
         * iOS ne permet pas de forcer Safari.
         * On ouvre donc normalement la destination.
         */

        window.location.href = destination;
    }


    window.onload = function() {

        redirect();

    };
</script>
